name: elaraby_workforce
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.0
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  pdf: ^3.11.3
  printing: ^5.14.3
  path_provider: ^2.1.5
  intl: ^0.19.0
  crypto: ^3.0.7
  http: ^1.6.0
  local_auth: ^2.3.0
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

flutter_launcher_icons:
  image_path: "icon_1024.png"
  android: true
  adaptive_icon_background: "#0B63B4"
  adaptive_icon_foreground: "icon_1024.png"
  ios: true
  remove_alpha_ios: true
