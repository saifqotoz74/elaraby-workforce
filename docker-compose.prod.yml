version: '3.8'

# ==============================================================================
# Workforce OS / PR Connect — Commercial Production Cloud Stack
# Multi-container orchestration:
#   1. api: Horizontally scalable Node.js server running in cluster mode
#   2. postgres: PostgreSQL 16 with automated daily SQL dumps
#   3. redis: Redis 7 with AOF persistence enabled
#   4. nginx: High-performance reverse proxy with wildcard routing (*.prconnect.app)
# ==============================================================================

networks:
  workforce_net:
    driver: bridge

volumes:
  pg_data_prod:
    driver: local
  pg_backups_prod:
    driver: local
  redis_data_prod:
    driver: local
  uploads_prod:
    driver: local

services:
  # ==========================================
  # 1. Reverse Proxy & Edge Router (Nginx)
  # ==========================================
  nginx:
    image: nginx:1.27-alpine
    container_name: prconnect_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
      - ./server/admin:/usr/share/nginx/html/admin:ro
      - uploads_prod:/usr/share/nginx/html/uploads:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - workforce_net

  # ==========================================
  # 2. Node.js API Backend (Clustered)
  # ==========================================
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: prconnect_api
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${DB_USER:-prconnect_admin}:${DB_PASSWORD:-Secure_Postgres_2026!}@postgres:5432/${DB_NAME:-workforce_os}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-Secure_Redis_2026!}@redis:6379
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set to at least 32 characters}
      - ADMIN_USER=${ADMIN_USER:-superadmin}
      - ADMIN_PASS=${ADMIN_PASS:?ADMIN_PASS must be provided}
      - STORAGE_PROVIDER=${STORAGE_PROVIDER:-local}
      - CORS_ORIGIN=https://*.prconnect.app,https://prconnect.app
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - uploads_prod:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - workforce_net

  # ==========================================
  # 3. PostgreSQL 16 Authoritative Database
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: prconnect_postgres
    restart: always
    environment:
      - POSTGRES_DB=${DB_NAME:-workforce_os}
      - POSTGRES_USER=${DB_USER:-prconnect_admin}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-Secure_Postgres_2026!}
    volumes:
      - pg_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-prconnect_admin} -d ${DB_NAME:-workforce_os}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - workforce_net

  # ==========================================
  # 4. Automated Daily Postgres Backup Daemon
  # ==========================================
  postgres_backup:
    image: postgres:16-alpine
    container_name: prconnect_db_backup
    restart: always
    environment:
      - PGHOST=postgres
      - PGUSER=${DB_USER:-prconnect_admin}
      - PGPASSWORD=${DB_PASSWORD:-Secure_Postgres_2026!}
      - PGDATABASE=${DB_NAME:-workforce_os}
    volumes:
      - pg_backups_prod:/backups
    entrypoint: |
      /bin/sh -c '
        echo "Postgres backup service started. Running automated daily dumps at 02:00 UTC...";
        while true; do
          DATE=$$(date +%Y%m%d_%H%M%S);
          echo "[Backup] Creating database dump: /backups/dump_$${DATE}.sql.gz";
          pg_dump -Fc | gzip > /backups/dump_$${DATE}.sql.gz;
          # Keep last 14 days of backups
          find /backups -name "dump_*.sql.gz" -mtime +14 -delete;
          sleep 86400;
        done
      '
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - workforce_net

  # ==========================================
  # 5. Redis 7 Persistent Mutex & Cache
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: prconnect_redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-Secure_Redis_2026!}
      --appendonly yes
      --appendfsync everysec
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-Secure_Redis_2026!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - workforce_net
