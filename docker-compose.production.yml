version: '3.8'

# ==============================================================================
# Elaraby Workforce — Complete Multi-Instance Enterprise Production Architecture
# Components:
#   - API (Stateless, horizontally scalable Node.js backend)
#   - Worker (Scalable BullMQ asynchronous background processors)
#   - PostgreSQL 16 (Authoritative ACID relational database)
#   - Redis 7 (Distributed Mutexes, Cluster Pub/Sub, Distributed Rate Limiting)
#   - MinIO (S3-compatible multi-instance object storage for files & medical attachments)
# ==============================================================================

networks:
  elaraby_network:
    driver: bridge

volumes:
  pg_data_prod:
    driver: local
  redis_data_prod:
    driver: local
  minio_data_prod:
    driver: local

services:
  # ==========================================
  # Primary API Cluster (Scale: docker compose -f docker-compose.production.yml up -d --scale api=2)
  # ==========================================
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: always
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M
    ports:
      - "3000-3001:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://elaraby_prod_user:${DB_PASSWORD:-Elaraby_PgSecure_2026!}@postgres:5432/elaraby_workforce
      - REDIS_URL=redis://:${REDIS_PASSWORD:-Elaraby_RedisSecure_2026!}@redis:6379
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be provided with at least 32 characters}
      - ADMIN_USER=${ADMIN_USER:-admin_elaraby}
      - ADMIN_PASS=${ADMIN_PASS:?ADMIN_PASS must be provided with strong credentials}
      - STORAGE_PROVIDER=s3
      - S3_ENDPOINT=http://minio:9000
      - S3_REGION=me-south-1
      - S3_BUCKET=elaraby-workforce
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY:-minio_admin_user}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_KEY:-minio_admin_password_2026!}
      - S3_FORCE_PATH_STYLE=true
      - SMS_PROVIDER=${SMS_PROVIDER:-mock}
      - PUSH_PROVIDER=${PUSH_PROVIDER:-mock}
      - ERP_PROVIDER=${ERP_PROVIDER:-mock}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://workforce.elarabygroup.com}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => { if (r.statusCode !== 200) process.exit(1); })"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - elaraby_network

  # ==========================================
  # Background Worker (Scale: docker compose -f docker-compose.production.yml up -d --scale worker=2)
  # ==========================================
  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: ["node", "worker.js"]
    restart: always
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
    environment:
      - NODE_ENV=production
      - SERVICE_NAME=elaraby-workforce-worker
      - DATABASE_URL=postgresql://elaraby_prod_user:${DB_PASSWORD:-Elaraby_PgSecure_2026!}@postgres:5432/elaraby_workforce
      - REDIS_URL=redis://:${REDIS_PASSWORD:-Elaraby_RedisSecure_2026!}@redis:6379
      - WORKER_CONCURRENCY=5
      - STORAGE_PROVIDER=s3
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=elaraby-workforce
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY:-minio_admin_user}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_KEY:-minio_admin_password_2026!}
      - SMS_PROVIDER=${SMS_PROVIDER:-mock}
      - PUSH_PROVIDER=${PUSH_PROVIDER:-mock}
      - ERP_PROVIDER=${ERP_PROVIDER:-mock}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - elaraby_network

  # ==========================================
  # PostgreSQL 16 (Authoritative Database)
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: elaraby-workforce-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: elaraby_workforce
      POSTGRES_USER: elaraby_prod_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Elaraby_PgSecure_2026!}
    volumes:
      - pg_data_prod:/var/lib/postgresql/data
      - ./server/src/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elaraby_prod_user -d elaraby_workforce"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - elaraby_network

  # ==========================================
  # Redis 7 (Distributed Locks, PubSub, Rate Limits, BullMQ)
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: elaraby-workforce-redis-prod
    restart: always
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-Elaraby_RedisSecure_2026!}", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data_prod:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-Elaraby_RedisSecure_2026!} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - elaraby_network

  # ==========================================
  # MinIO Object Storage (Self-Hosted S3 Multi-Instance Provider)
  # ==========================================
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: elaraby-workforce-minio-prod
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio_admin_user}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minio_admin_password_2026!}
    volumes:
      - minio_data_prod:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - elaraby_network
