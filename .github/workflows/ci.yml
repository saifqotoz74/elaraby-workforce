name: Production CI/CD Pipeline

on:
  push:
    branches: [ main, master, release/* ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-quality-gate:
    name: Backend Lint, Security & Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies
        working-directory: server
        run: npm ci

      - name: Static Code Syntax Validation
        working-directory: server
        run: |
          find . -name "*.js" -not -path "*/node_modules/*" -exec node -c {} +

      - name: Enterprise Secret Audit
        working-directory: server
        run: node scripts/audit-secrets.js

      - name: PostgreSQL Migrations & Schema Validation
        working-directory: server
        run: |
          node scripts/migrate-postgres.js --status
          node scripts/migrate-json-to-postgres.js --validate

      - name: Enterprise Production Configuration & Infrastructure Audit
        working-directory: server
        run: node scripts/validate-production.js

      - name: Execute Full Backend Test Suite (All 58 Suites)
        working-directory: server
        run: npm test
        env:
          NODE_ENV: test
          PORT: 3001

      - name: Execute Master E2E Opaque-Box Suite (395 Tests)
        run: node test_infra/runner.js

  mobile-quality-gate:
    name: Flutter Lint, Analyze & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter 3.29.x
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format --set-exit-if-changed lib test

      - name: Static Code Analysis (0 Issues Enforced)
        run: flutter analyze

      - name: Run Complete Mobile Test Suite (221 Tests)
        run: flutter test --coverage
