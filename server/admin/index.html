<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elaraby Connect — HR Admin Dashboard</title>
  <meta name="description" content="Elaraby Workforce HR Enterprise Administration Platform and Mobile Bridge">
  <link rel="icon" type="image/png" href="logo.png">

  <!-- Typography: Inter & Cairo for English and Arabic typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- Production Design System & Component Styles -->
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/views.css">
</head>
<body>
  <!-- Root Container Managed Reactively by App Router -->
  <div id="app">
    <!-- Initial Splash / Loading State -->
    <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0A1A2F; color: #FFFFFF; font-family: 'Inter', sans-serif;">
      <div style="width: 52px; height: 52px; border-radius: 14px; background: linear-gradient(135deg, #0B63B4, #3B82F6); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 22px; margin-bottom: 20px; box-shadow: 0 10px 25px rgba(11, 99, 180, 0.4);">
        EC
      </div>
      <h2 style="font-size: 18px; font-weight: 700; margin: 0 0 6px 0; letter-spacing: -0.01em;">Elaraby Connect — HR Admin Dashboard</h2>
      <p style="color: #7E93B4; font-size: 13px; margin: 0;">Initializing Secure Administration Environment...</p>
    </div>
  </div>

  <!-- Toast Notification Container Root -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Native ES Module Application Bootstrap -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
