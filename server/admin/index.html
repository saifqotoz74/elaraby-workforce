<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <base href="/admin/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workforce OS — HR Admin Dashboard</title>
  <meta name="description" content="Workforce OS Enterprise Administration Platform and Multi-Tenant Management Console">
  <link rel="icon" type="image/png" href="/admin/logo.png">

  <!-- Typography: Inter (Latin), Cairo (Arabic) & JetBrains Mono with comprehensive weight coverage -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Production Design System & Component Styles -->
  <link rel="stylesheet" href="/admin/css/design-system.css">
  <link rel="stylesheet" href="/admin/css/components.css">
  <link rel="stylesheet" href="/admin/css/views.css">
</head>
<body>
  <!-- Root Container Managed Reactively by App Router -->
  <div id="app">
    <!-- Initial Splash / Loading State -->
    <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0A1A2F; color: #FFFFFF; font-family: 'Inter', sans-serif;">
      <div style="width: 52px; height: 52px; border-radius: 14px; background: linear-gradient(135deg, #1E40AF, #3B82F6); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 22px; margin-bottom: 20px; box-shadow: 0 10px 25px rgba(30, 64, 175, 0.4);">
        WF
      </div>
      <h2 style="font-size: 18px; font-weight: 700; margin: 0 0 6px 0; letter-spacing: -0.01em;">Workforce OS — HR Admin Dashboard</h2>
      <p style="color: #7E93B4; font-size: 13px; margin: 0;">Initializing Secure Administration Environment...</p>
    </div>
  </div>

  <!-- Toast Notification Container Root -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Startup Watchdog: Prevents frozen splash screen if network stalls -->
  <script>
    window.__appMounted = false;
    window.addEventListener('error', function(e) {
      console.error('Startup script error:', e.error || e.message);
      if (!window.__appMounted) {
        var app = document.getElementById('app');
        var msg = app ? app.querySelector('p') : null;
        if (msg) {
          msg.innerHTML = '<span style="color:#F87171;">Connection or session refreshed.</span><br><button onclick="sessionStorage.clear(); localStorage.clear(); location.reload(true);" style="margin-top:14px; padding:8px 18px; background:#0284C7; color:#fff; border:none; border-radius:8px; cursor:pointer; font-weight:600; font-family:sans-serif;">Reset Session & Enter</button>';
        }
      }
    });
    setTimeout(function() {
      if (!window.__appMounted) {
        var app = document.getElementById('app');
        var msg = app ? app.querySelector('p') : null;
        if (msg) {
          msg.innerHTML = '<button onclick="location.hash=\'#/login\'; location.reload();" style="margin-top:14px; padding:9px 20px; background:#0284C7; color:#fff; border:none; border-radius:8px; cursor:pointer; font-weight:600; font-family:sans-serif; box-shadow: 0 4px 14px rgba(2,132,199,0.4);">Click to Enter Dashboard</button>';
        }
      }
    }, 2500);
  </script>

  <!-- Native ES Module Application Bootstrap -->
  <script type="module" src="/admin/js/app.js"></script>
</body>
</html>
