plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.elaraby.workforce.elaraby_workforce"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
        freeCompilerArgs += ["-Xskip-metadata-version-check"]
    }

    defaultConfig {
        applicationId = "com.elaraby.workforce.elaraby_workforce"
        minSdk = 23
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        manifestPlaceholders = [
            appName: "PR Connect",
            applicationName: "io.flutter.app.FlutterApplication"
        ]
    }

    flavorDimensions "enterprise"

    productFlavors {
        generic {
            dimension "enterprise"
            applicationId "com.elaraby.workforce.elaraby_workforce"
            manifestPlaceholders = [
                appName: "PR Connect",
                applicationName: "io.flutter.app.FlutterApplication"
            ]
        }
        elaraby {
            dimension "enterprise"
            applicationId "com.elaraby.workforce"
            manifestPlaceholders = [
                appName: "العربي كونكت",
                applicationName: "io.flutter.app.FlutterApplication"
            ]
        }
        elsewedy {
            dimension "enterprise"
            applicationId "com.elsewedy.workforce"
            manifestPlaceholders = [
                appName: "Elsewedy Connect",
                applicationName: "io.flutter.app.FlutterApplication"
            ]
        }
        ghabbour {
            dimension "enterprise"
            applicationId "com.gbcorp.workforce"
            manifestPlaceholders = [
                appName: "GB Corp Connect",
                applicationName: "io.flutter.app.FlutterApplication"
            ]
        }
        tmg {
            dimension "enterprise"
            applicationId "com.tmg.workforce"
            manifestPlaceholders = [
                appName: "TMG Connect",
                applicationName: "io.flutter.app.FlutterApplication"
            ]
        }
        gulf_industrial {
            dimension "enterprise"
            applicationId "com.gulfcorp.workforce"
            manifestPlaceholders = [
                appName: "Gulf Industrial",
                applicationName: "io.flutter.app.FlutterApplication"
            ]
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias = keystoreProperties['keyAlias']
                keyPassword = keystoreProperties['keyPassword']
                storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword = keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source = "../.."
}

def googleServicesJson = file("google-services.json")
if (googleServicesJson.exists()) {
    apply plugin: "com.google.gms.google-services"
}

dependencies {
    // Import the Firebase BoM
    implementation platform('com.google.firebase:firebase-bom:33.9.0')
}
